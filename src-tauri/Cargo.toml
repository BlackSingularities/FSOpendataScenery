[package]
name = "fs-opendata-scenery"
version = "1.0.2"
description = "FS Opendata Scenery – generator scenerii z otwartych danych (rzeźba terenu, oświetlenie z OSM, przeszkody) dla Microsoft Flight Simulator 2024"
authors = ["Adam Rędzikowski"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "fs_opendata_scenery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip", "blocking"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process", "io-util"] }
rayon = "1"
walkdir = "2"
once_cell = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.9"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
roxmltree = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "v5"] }
urlencoding = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
